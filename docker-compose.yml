name: uk-online

x-backend: &backend
  build: ./backend
  image: uk-online/backend
  env_file:
    - path: .env
      required: false
  environment:
    DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-uk}:${POSTGRES_PASSWORD:-uk}@db:5432/${POSTGRES_DB:-uk}
  restart: unless-stopped

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-uk}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-uk}
      POSTGRES_DB: ${POSTGRES_DB:-uk}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # Миграции — отдельным одноразовым контейнером: API стартует только после них,
  # и при нескольких репликах API миграции не запускаются конкурентно.
  migrate:
    <<: *backend
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    depends_on:
      db:
        condition: service_healthy

  api:
    <<: *backend
    depends_on:
      migrate:
        condition: service_completed_successfully

  web:
    build: ./frontend
    image: uk-online/frontend
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      - api
    restart: unless-stopped

  # Демо-данные: docker compose --profile demo run --rm seed
  seed:
    <<: *backend
    command: ["python", "-m", "app.cli", "seed-demo"]
    restart: "no"
    profiles: ["demo"]
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
