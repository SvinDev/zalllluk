name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.8.17"

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: uk
          POSTGRES_PASSWORD: uk
          POSTGRES_DB: uk_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U uk -d uk_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://uk:uk@localhost:5432/uk_test
      TEST_DATABASE_URL: postgresql+asyncpg://uk:uk@localhost:5432/uk_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --frozen
      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Type check
        run: uv run mypy app
      - name: Migrations apply, revert and match the models
        run: |
          uv run alembic upgrade head
          uv run alembic check
          uv run alembic downgrade base
      - name: Tests
        run: uv run pytest -q

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: npm ci --no-audit --no-fund
      - name: API types are in sync with the backend
        run: |
          (cd ../backend && uv sync --frozen --no-dev && uv run --no-dev python -m app.cli openapi) > openapi.json
          npm run gen:api
          git diff --exit-code -- openapi.json src/api/schema.d.ts
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  docker:
    name: Docker images
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - run: docker compose build

  allinone:
    name: All-in-one image (Railway)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: uk
          POSTGRES_PASSWORD: uk
          POSTGRES_DB: uk
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U uk -d uk"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # URL в формате PaaS — приложение само переводит его на asyncpg.
      DATABASE_URL: postgresql://uk:uk@localhost:5432/uk
      SECRET_KEY: ci-only-secret-0123456789abcdef0123456789abcdef
      SEED_DEMO: "true"
      PORT: "8000"
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t uk-allinone .
      - name: Pre-deploy twice (migrations, demo seed, then idempotent re-run)
        run: |
          for _ in 1 2; do
            docker run --rm --network host -e DATABASE_URL -e SECRET_KEY -e SEED_DEMO -e PORT \
              uk-allinone sh predeploy.sh
          done
      - name: Smoke test
        run: |
          docker run -d --name app --network host -e DATABASE_URL -e SECRET_KEY -e PORT uk-allinone
          for _ in $(seq 1 30); do curl -fs localhost:8000/api/health >/dev/null 2>&1 && break; sleep 1; done
          curl -fsS localhost:8000/api/health
          curl -fsS localhost:8000/tickets | grep -q 'id="root"'
          curl -fsS localhost:8000/api/v1/auth/login -H 'Content-Type: application/json' \
            -d '{"email":"admin@demo.ru","password":"demo12345"}' | grep -q access_token
      - if: failure()
        run: docker logs app
